[project]
name = "jobweaver"
version = "0.1.0"
description = "Self-hosted job search: collect postings, score them against your CV, track applications, and write evidence-checked CVs and cover letters."
authors = [{ name = "Fırat Yalçın" }]
license = "MIT"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "apify-client>=2.5.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.133.0",
    "mcp>=2.3,<3",
    "pandas>=2.2.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "uvicorn>=0.41.0",
]

[dependency-groups]
# Browser checks in scripts/ (Typst WASM verification, UX audits).
dev = ["selenium>=4.0.0"]
