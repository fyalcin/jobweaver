name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils latexdiff \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Typst
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  typst.tar.xz" | sha256sum --check
          sudo tar -xJf typst.tar.xz -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          rm typst.tar.xz
          typst --version
      - run: uv sync --frozen
      - name: Check release files
        run: uv run --frozen python scripts/release_check.py
      - name: Run isolated tests
        run: uv run --frozen python scripts/test_isolated.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm --prefix webapp ci
      - run: npm --prefix webapp run lint
      - run: npm --prefix webapp run build
      - name: Run frontend regressions
        run: |
          node scripts/test_document_frontend.mjs
          node scripts/test_match_rating_frontend.mjs
          node scripts/test_studio_frontend.mjs
          node scripts/test_ui_preferences.mjs
