<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jobweaver.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobweaver</title>
    <script>
      (function() {
        try {
          var themes = {'loden-light':'light','loden-dark':'dark','kanagawa-wave':'dark','kanagawa-dragon':'dark','kanagawa-lotus':'light','catppuccin-mocha':'dark','catppuccin-latte':'light','rose-pine':'dark','nord':'dark'};
          var retired = ['aurora', 'ember', 'neon', 'aurora-ember', 'aurora-neon', 'amber-neon'];
          var saved = (localStorage.getItem('gj_active_theme') || '').trim().toLowerCase();
          var theme = retired.includes(saved) ? 'loden-dark' : (themes[saved] ? saved : 'loden-light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = themes[theme];
          var fonts = ['fira-sans', 'inter', 'geist', 'plus-jakarta-sans', 'dm-sans', 'ibm-plex-sans', 'manrope'];
          var font = (localStorage.getItem('gj_active_font') || '').trim().toLowerCase();
          document.documentElement.setAttribute('data-font', fonts.includes(font) ? font : 'fira-sans');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
