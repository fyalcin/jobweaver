<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jobweaver.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobweaver</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('gj_active_theme');
          if (theme && theme !== 'default') {
            document.documentElement.setAttribute('data-theme', theme);
          }
          var font = localStorage.getItem('gj_active_font');
          if (font && font !== 'inter') {
            document.documentElement.setAttribute('data-font', font);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
